# Netlify deployment configuration
# The frontend is a Vite SPA; the Express server in server.ts is used for
# local development and non-Netlify hosting only.
[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Express API is not part of the static Netlify build. Return a clear JSON
# 404 for API calls instead of the SPA HTML. To enable the full app on Netlify,
# host server.ts on a Node host and add a proxy redirect like this:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-host.example.com/api/:splat"
#   status = 200
#   force = true
[[redirects]]
  from = "/api/*"
  to = "/api-unavailable.json"
  status = 404

# SPA fallback so client-side routes survive a refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the app shell and service worker.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
