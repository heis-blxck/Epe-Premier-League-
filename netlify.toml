# Netlify deployment configuration
# The frontend is a Vite SPA; the Express server in server.ts is used for
# local development and non-Netlify hosting only.
[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so client-side routes survive a refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the app shell and service worker.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
