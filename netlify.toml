# Netlify deployment configuration
# The frontend is a Vite SPA. The Express app in server/app.ts is bundled into
# a Netlify Function, so the API and frontend deploy together.
[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy browser requests for /api/* to the Express app inside the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes survive a refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the app shell and service worker.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
